<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Policy change review workflow</title><desc id="desc">A flow from scheduled source fingerprinting through human review, rule update, tests, evidence, and merge.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#1dbf73"/></marker></defs>
  <rect width="1440" height="640" rx="26" fill="#07130d"/><style>.b{fill:#111d17;stroke:#3d6551;stroke-width:2}.g{fill:#143923;stroke:#1dbf73;stroke-width:3}.h{font:700 30px Segoe UI,sans-serif;fill:#fff}.t{font:700 18px Segoe UI,sans-serif;fill:#fff}.s{font:400 14px Segoe UI,sans-serif;fill:#a6b9af}.l{fill:none;stroke:#1dbf73;stroke-width:3;marker-end:url(#a)}</style>
  <text x="55" y="65" class="h">Policy Change Review — Human in the Loop</text>
  <g transform="translate(55 150)"><rect width="210" height="130" rx="18" class="b"/><text x="25" y="45" class="t">Weekly schedule</text><text x="25" y="77" class="s">or manual dispatch</text><text x="25" y="102" class="s">GitHub Actions</text></g>
  <path d="M265 215h75" class="l"/>
  <g transform="translate(350 150)"><rect width="240" height="130" rx="18" class="b"/><text x="25" y="45" class="t">Fetch official API</text><text x="25" y="77" class="s">normalize article body</text><text x="25" y="102" class="s">calculate SHA-256</text></g>
  <path d="M590 215h75" class="l"/>
  <g transform="translate(675 150)"><rect width="220" height="130" rx="18" class="g"/><text x="25" y="45" class="t">Hash changed?</text><text x="25" y="77" class="s">No → no repository diff</text><text x="25" y="102" class="s">Yes → open review PR</text></g>
  <path d="M895 215h75" class="l"/>
  <g transform="translate(980 150)"><rect width="190" height="130" rx="18" class="b"/><text x="25" y="45" class="t">Human review</text><text x="25" y="77" class="s">inspect source</text><text x="25" y="102" class="s">classify impact</text></g>
  <path d="M1170 215h75" class="l"/>
  <g transform="translate(1255 150)"><rect width="140" height="130" rx="18" class="b"/><text x="18" y="45" class="t">Decision</text><text x="18" y="77" class="s">update rule</text><text x="18" y="102" class="s">or close PR</text></g>
  <path d="M1325 280v100H785v55" class="l"/>
  <g transform="translate(630 445)"><rect width="310" height="120" rx="18" class="g"/><text x="28" y="43" class="t">Quality gate and evidence</text><text x="28" y="74" class="s">tests • ≥90% coverage • validation</text><text x="28" y="99" class="s">merge only when green</text></g>
  <path d="M675 215v175H470v45" class="l"/><text x="480" y="376" class="s">unchanged</text>
  <g transform="translate(350 445)"><rect width="240" height="120" rx="18" class="b"/><text x="26" y="43" class="t">No action</text><text x="26" y="76" class="s">stable fingerprint</text></g>
</svg>
