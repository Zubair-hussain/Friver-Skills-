name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test tooling
        run: python -m pip install coverage pytest
      - name: Run tests with branch coverage
        run: |
          python -m coverage run -m pytest -q --junitxml=records/test-results/junit.xml
          python -m coverage report -m
          python -m coverage json
      - name: Upload test and coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: quality-evidence
          path: |
            records/test-results/junit.xml
            records/coverage/coverage.json
